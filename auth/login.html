<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sweet Delights Bakery</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <div class="auth-container">
    <!-- Header -->
    <div class="auth-header">
      <div class="auth-logo">Sweet Delights</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Login to access your account</p>
    </div>

    <!-- Alert Messages -->
    <div id="alertMessage" class="alert"></div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form">
      
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="your@email.com" 
          required 
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="Enter your password" 
          required 
          autocomplete="current-password"
        />
      </div>

      <div class="forgot-password">
        <a href="forgot-password.html">Forgot password?</a>
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Login
      </button>

    </form>

    <!-- Divider -->
    <div class="auth-divider">Or continue with</div>

    <!-- Google Sign-in -->
    <button id="googleSignInBtn" class="btn btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </button>

    <!-- Links -->
    <div class="auth-links">
      <p class="auth-text">
        Don't have an account? 
        <a href="register.html" class="auth-link">Sign up</a>
      </p>
    </div>

    <!-- Back to Site -->
    <div class="back-to-site">
      <a href="../public/index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to website
      </a>
    </div>
  </div>

<script src="js/simple-data-manager.js"></script>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const alertMessage = document.getElementById('alertMessage');

    // Get redirect URL from query params
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || '../public/index.html';

    // Handle email/password login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Show loading state
      loginBtn.classList.add('btn-loading');
      loginBtn.disabled = true;
      hideAlert();

      try {
        await window.authManager.loginWithEmail(email, password);
        
    const user = firebase.auth().currentUser;
    const token = await user.getIdToken();

    const response = await fetch('http://localhost:3000/api/auth/protected', {
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    const text = await response.text();
    console.log("Backend response:", text);

        // Check if user is trying to access admin panel
        if (redirectUrl.includes('admin')) {
          const isAdmin = await window.authManager.checkIsAdmin(email);
          
          if (!isAdmin) {
            throw new Error('Access Denied: Admin privileges required');
          }
        }

        // Success - redirect
        showAlert('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 1000);

      } catch (error) {
        console.error('Login error:', error);
        showAlert(error.message, 'error');
        loginBtn.classList.remove('btn-loading');
        loginBtn.disabled = false;
      }
    });

    // Handle Google sign-in
    googleSignInBtn.addEventListener('click', async () => {
      googleSignInBtn.classList.add('btn-loading');
      googleSignInBtn.disabled = true;
      hideAlert();

      try {
        const user = await window.authManager.loginWithGoogle();
        
        // Check if user is trying to access admin panel
        if (redirectUrl.includes('admin')) {
          const isAdmin = await window.authManager.checkIsAdmin(user.email);
          
          if (!isAdmin) {
            await window.authManager.logout();
            throw new Error('Access Denied: Admin privileges required');
          }
        }

        // Success - redirect
        showAlert('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 1000);

      } catch (error) {
        console.error('Google sign-in error:', error);
        showAlert(error.message, 'error');
        googleSignInBtn.classList.remove('btn-loading');
        googleSignInBtn.disabled = false;
      }
    });

    // Alert helper functions
    function showAlert(message, type) {
      alertMessage.textContent = message;
      alertMessage.className = `alert alert-${type} show`;
    }

    function hideAlert() {
      alertMessage.className = 'alert';
    }

    // Check if user is already logged in
    window.onAuthStateChanged = (user, isAdmin) => {
      if (user) {
        // User is already logged in
        if (redirectUrl.includes('admin') && !isAdmin) {
          // Trying to access admin but not admin
          return;
        }
        // Redirect to intended page or home
        window.location.href = redirectUrl;
      }
    };
  </script>

</body>
</html>
