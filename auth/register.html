<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Sweet Delights Bakery</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <div class="auth-container">
    <!-- Header -->
    <div class="auth-header">
      <div class="auth-logo">Sweet Delights</div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join us to order delicious cakes</p>
    </div>

    <!-- Alert Messages -->
    <div id="alertMessage" class="alert"></div>

    <!-- Registration Form -->
    <form id="registerForm" class="auth-form">
      
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          class="form-input" 
          placeholder="John Doe" 
          required 
          autocomplete="name"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="your@email.com" 
          required 
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <input 
          type="tel" 
          id="phone" 
          class="form-input" 
          placeholder="08012345678" 
          required 
          autocomplete="tel"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="At least 6 characters" 
          required 
          autocomplete="new-password"
        />
        <div class="password-strength">
          <div id="passwordStrengthBar" class="password-strength-bar"></div>
        </div>
        <p class="password-hint" id="passwordHint">Use at least 6 characters</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          class="form-input" 
          placeholder="Re-enter password" 
          required 
          autocomplete="new-password"
        />
      </div>

      <div class="form-checkbox">
        <input type="checkbox" id="terms" required />
        <label for="terms">
          I agree to the <a href="../index.html#terms" class="auth-link">Terms & Conditions</a>
        </label>
      </div>

      <button type="submit" id="registerBtn" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
        Create Account
      </button>

    </form>

    <!-- Divider -->
    <div class="auth-divider">Or continue with</div>

    <!-- Google Sign-in -->
    <button id="googleSignInBtn" class="btn btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign up with Google
    </button>

    <!-- Links -->
    <div class="auth-links">
      <p class="auth-text">
        Already have an account? 
        <a href="login.html" class="auth-link">Login</a>
      </p>
    </div>

    <!-- Back to Site -->
    <div class="back-to-site">
      <a href="../index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to website
      </a>
    </div>
  </div>

<script src="js/simple-data-manager.js"></script>

  <script>
    const registerForm = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const alertMessage = document.getElementById('alertMessage');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const passwordStrengthBar = document.getElementById('passwordStrengthBar');
    const passwordHint = document.getElementById('passwordHint');

    // Password strength checker
    password.addEventListener('input', () => {
      const value = password.value;
      let strength = 0;
      let hint = '';

      if (value.length >= 6) strength++;
      if (value.length >= 8) strength++;
      if (/[A-Z]/.test(value)) strength++;
      if (/[0-9]/.test(value)) strength++;
      if (/[^A-Za-z0-9]/.test(value)) strength++;

      // Update UI
      if (value.length === 0) {
        passwordStrengthBar.className = 'password-strength-bar';
        passwordHint.textContent = 'Use at least 6 characters';
      } else if (strength <= 2) {
        passwordStrengthBar.className = 'password-strength-bar weak';
        passwordHint.textContent = 'Weak password - add more characters';
      } else if (strength <= 3) {
        passwordStrengthBar.className = 'password-strength-bar medium';
        passwordHint.textContent = 'Medium strength - add numbers or symbols';
      } else {
        passwordStrengthBar.className = 'password-strength-bar strong';
        passwordHint.textContent = 'Strong password ✓';
      }
    });

    // Handle registration
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const pass = password.value;
      const confirmPass = confirmPassword.value;

      // Validate passwords match
      if (pass !== confirmPass) {
        showAlert('Passwords do not match', 'error');
        return;
      }

      // Validate password length
      if (pass.length < 6) {
        showAlert('Password must be at least 6 characters', 'error');
        return;
      }

      // Show loading state
      registerBtn.classList.add('btn-loading');
      registerBtn.disabled = true;
      hideAlert();

      try {
        await window.authManager.registerCustomer({
          email,
          password: pass,
          fullName,
          phone
        });

        // Success - show message and redirect
        showAlert('Account created successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = '../index.html';
        }, 1500);

      } catch (error) {
        console.error('Registration error:', error);
        showAlert(error.message, 'error');
        registerBtn.classList.remove('btn-loading');
        registerBtn.disabled = false;
      }
    });

    // Handle Google sign-up
    googleSignInBtn.addEventListener('click', async () => {
      googleSignInBtn.classList.add('btn-loading');
      googleSignInBtn.disabled = true;
      hideAlert();

      try {
        await window.authManager.loginWithGoogle();

        // Success - redirect
        showAlert('Account created successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = '../index.html';
        }, 1500);

      } catch (error) {
        console.error('Google sign-up error:', error);
        showAlert(error.message, 'error');
        googleSignInBtn.classList.remove('btn-loading');
        googleSignInBtn.disabled = false;
      }
    });

    // Alert helper functions
    function showAlert(message, type) {
      alertMessage.textContent = message;
      alertMessage.className = `alert alert-${type} show`;
    }

    function hideAlert() {
      alertMessage.className = 'alert';
    }

    // Check if user is already logged in
    window.onAuthStateChanged = (user) => {
      if (user) {
        // User is already logged in, redirect to home
        window.location.href = '../public/index.html';
      }
    };
  </script>

</body>
</html>
