<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Login - Sweet Delights Bakery</title>

  <link rel="stylesheet" href="auth.css" />

</head>

<body>



  <div class="auth-container">

    <div class="auth-header">

      <div class="auth-logo">Sweet Delights</div>

      <h1 class="auth-title">Admin Login</h1>

      <p class="auth-subtitle">Enter your credentials to continue</p>

    </div>



    <div id="alertMessage" class="alert"></div>



    <form id="loginForm" class="auth-form">

      

      <div class="form-group">

        <label class="form-label" for="email">Email</label>

        <input 

          type="email" 

          id="email" 

          class="form-input" 

          placeholder="admin@sweetdelights.com" 

          required 

          value="admin@sweetdelights.com"

        />

      </div>



      <div class="form-group">

        <label class="form-label" for="password">Password</label>

        <input 

          type="password" 

          id="password" 

          class="form-input" 

          placeholder="Enter password" 

          required

          value="admin123"

        />

      </div>



      <button type="submit" id="loginBtn" class="btn btn-primary">

        Login

      </button>



      <div style="margin-top: 1.5rem; padding: 1rem; background: var(--cream); border-radius: 10px; font-size: 0.85rem;">

        <strong>Default Credentials:</strong><br>

        Email: admin@sweetdelights.com<br>

        Password: admin123

      </div>



    </form>



    <div class="back-to-site">

      <a href="../index.html">← Back to website</a>

    </div>

  </div>

  <script src="../js/admin.js"></script>


<script type="module">
  import { apiLogin, getUser, isLoggedIn, isAdmin } from '../js/api.js'

  // If already logged in as admin, redirect
  if (isLoggedIn() && isAdmin()) {
    window.location.href = '../admin/admin-index.html'
  }

  function showAlert(msg, type) {
    const el = document.getElementById('alertMessage')
    el.textContent = msg
    el.className = `alert alert-${type} show`
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault()

    const email    = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const btn      = document.getElementById('loginBtn')

    btn.disabled = true
    btn.textContent = 'Logging in...'

    try {
      const data = await apiLogin({ email, password })

      if (data.user.role !== 'ADMIN') {
        showAlert('Access denied. Admin privileges required.', 'error')
        btn.disabled = false
        btn.textContent = 'Login'
        return
      }

      showAlert('Login successful! Redirecting...', 'success')
      setTimeout(() => {
        window.location.href = '../admin/admin-index.html'
      }, 1000)

    } catch (err) {
      showAlert(err.message || 'Invalid email or password', 'error')
      btn.disabled = false
      btn.textContent = 'Login'
    }
  })
</script>


</body>

</html>
