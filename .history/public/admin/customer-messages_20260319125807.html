<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages – Sweet Delights Admin</title>
  <link rel="stylesheet" href="admin-shared.css" />
  <style>
    /* ── MESSAGING LAYOUT ── */
    .messaging-wrap {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100vh - 110px); /* minus header + nav */
      background: var(--cream);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    /* LEFT: CONVERSATION LIST */
    .conv-panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--cream-dark);
    }

    .conv-panel-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--cream);
      flex-shrink: 0;
    }

    .conv-panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--brown);
    }

    .conv-search {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      color: var(--ink);
      background: #fff;
      margin-top: 0.65rem;
      transition: border-color 0.2s;
    }
    .conv-search:focus { outline: none; border-color: var(--gold); }

    .conv-list {
      flex: 1;
      overflow-y: auto;
    }

    .conv-item {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
      background: var(--cream);
      border-left: 3px solid transparent;
    }
    .conv-item:hover { background: var(--cream-dark); }
    .conv-item.active {
      background: #fff;
      border-left-color: var(--brown);
    }

    .conv-item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.3rem;
    }

    .conv-name {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink);
    }

    .conv-time {
      font-size: 0.65rem;
      color: var(--stone);
      font-weight: 300;
      flex-shrink: 0;
    }

    .conv-preview {
      font-size: 0.75rem;
      color: var(--stone);
      font-weight: 300;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-unread {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--gold);
      margin-right: 0.4rem;
      flex-shrink: 0;
    }

    .conv-empty {
      padding: 3rem 1.5rem;
      text-align: center;
    }
    .conv-empty p { font-size: 0.8rem; color: var(--stone); font-weight: 300; }

    /* RIGHT: CHAT THREAD */
    .thread-panel {
      display: flex;
      flex-direction: column;
      background: var(--cream-dark);
      height: 100%;
      overflow: hidden;
    }

    .thread-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 0.5rem;
    }

    .thread-empty-icon {
      width: 48px; height: 48px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .thread-empty-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      color: var(--brown);
    }

    .thread-empty-sub {
      font-size: 0.78rem;
      color: var(--stone);
      font-weight: 300;
    }

    /* Thread header */
    .thread-header {
      background: var(--cream);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .thread-customer {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .thread-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--brown);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      color: var(--gold-light);
      font-weight: 600;
      flex-shrink: 0;
    }

    .thread-customer-name {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--ink);
    }

    .thread-customer-count {
      font-size: 0.72rem;
      color: var(--stone);
      font-weight: 300;
    }

    /* Messages */
    .thread-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .thread-messages::-webkit-scrollbar { width: 4px; }
    .thread-messages::-webkit-scrollbar-thumb { background: rgba(92,51,23,0.15); border-radius: 2px; }

    .msg-wrap {
      display: flex;
      flex-direction: column;
      max-width: 65%;
    }
    .msg-wrap.customer { align-self: flex-start; align-items: flex-start; }
    .msg-wrap.admin    { align-self: flex-end;   align-items: flex-end; }

    .msg-sender {
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--stone);
      font-weight: 500;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .msg-bubble {
      padding: 0.8rem 1rem;
      border-radius: 2px;
      font-size: 0.85rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .msg-bubble.customer {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--ink);
      border-bottom-left-radius: 0;
    }

    .msg-bubble.admin {
      background: var(--brown);
      color: #fff;
      border-bottom-right-radius: 0;
    }

    .msg-time {
      font-size: 0.62rem;
      color: var(--stone);
      font-weight: 300;
      margin-top: 0.25rem;
    }

    /* Reply input */
    .thread-input-area {
      background: var(--cream);
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      flex-shrink: 0;
    }

    .thread-input-row {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }

    .thread-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      color: var(--ink);
      background: #fff;
      resize: none;
      min-height: 40px;
      max-height: 100px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }
    .thread-input:focus { outline: none; border-color: var(--gold); }

    .reply-btn {
      width: 40px; height: 40px;
      background: var(--brown);
      border: none;
      border-radius: 2px;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .reply-btn:hover { background: var(--brown-mid); }
    .reply-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (max-width: 768px) {
      .messaging-wrap { grid-template-columns: 1fr; height: auto; }
      .conv-panel { height: 280px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="admin-header">
    <div class="admin-logo">
      Sweet Delights
      <span class="admin-badge">Admin</span>
    </div>
    <div class="admin-user">
      <span class="admin-user-name" id="adminUserName">Admin</span>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
  </header>

  <!-- NAV -->
  <nav class="admin-nav">
    <a href="admin-index.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Dashboard
    </a>
    <a href="cake-orders.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
      </svg>
      Orders
    </a>
    <a href="customer-messages.html" class="admin-nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Messages
    </a>
  </nav>

  <!-- MESSAGING LAYOUT — flush, no admin-container padding -->
  <div style="padding: 0 5%; background: var(--bg);">
    <div style="max-width:1300px; margin:0 auto; padding: 1.5rem 0;">

      <div class="page-title" style="margin-bottom:1rem;">
        <h1>Customer Messages</h1>
        <p>Read and reply to customer conversations</p>
      </div>

      <div class="messaging-wrap">

        <!-- LEFT: CONVERSATIONS -->
        <div class="conv-panel">
          <div class="conv-panel-header">
            <div class="conv-panel-title">Conversations</div>
            <input class="conv-search" id="convSearch" placeholder="Search customers…" oninput="filterConvs()" />
          </div>
          <div class="conv-list" id="convList">
            <div class="conv-empty"><p>Loading…</p></div>
          </div>
        </div>

        <!-- RIGHT: THREAD -->
        <div class="thread-panel" id="threadPanel">
          <div class="thread-empty" id="threadEmpty">
            <div class="thread-empty-icon">💬</div>
            <div class="thread-empty-title">No conversation selected</div>
            <p class="thread-empty-sub">Choose a customer from the list to view their messages</p>
          </div>

          <div id="threadActive" style="display:none; flex-direction:column; height:100%; overflow:hidden;">
            <div class="thread-header">
              <div class="thread-customer">
                <div class="thread-avatar" id="threadAvatar"></div>
                <div>
                  <div class="thread-customer-name" id="threadName"></div>
                  <div class="thread-customer-count" id="threadCount"></div>
                </div>
              </div>
            </div>
            <div class="thread-messages" id="threadMessages"></div>
            <div class="thread-input-area">
              <div class="thread-input-row">
                <textarea
                  class="thread-input"
                  id="replyInput"
                  placeholder="Type your reply…"
                  rows="1"
                  oninput="autoResize(this)"
                  onkeydown="handleKey(event)"
                ></textarea>
                <button class="reply-btn" onclick="sendReply()">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/simple-data-manager.js"></script>
  <script>

    // ── AUTH ──
    (function() {
      const user = window.dataManager && window.dataManager.getCurrentUser();
      if (!user || !user.isAdmin) window.location.href = '../auth/admin-login.html';
      else document.getElementById('adminUserName').textContent = user.email || 'Admin';
    })();

    let conversations = [];
    let selectedSender = null;

    // ── LOAD ──
    // BACKEND PLACEHOLDER:
    // const res = await fetch('/api/admin/messages', { headers:{ Authorization:'Bearer '+token } });
    // const msgs = await res.json(); buildConversations(msgs);
    function load() {
      const msgs = window.dataManager.getMessages() || [];
      buildConversations(msgs);
    }

    function buildConversations(msgs) {
      const map = {};
      msgs.forEach(m => {
        const key = m.isAdmin ? (m.replyTo || 'admin') : m.sender;
        if (m.isAdmin && !m.replyTo) return; // skip unpaired admin msgs
        if (!map[key]) {
          map[key] = { sender: key, messages: [], lastTs: 0, hasUnread: false };
        }
        map[key].messages.push(m);
        if (m.timestamp > map[key].lastTs) map[key].lastTs = m.timestamp;
        if (!m.isAdmin) map[key].hasUnread = true;
      });

      conversations = Object.values(map)
        .filter(c => c.sender !== 'admin')
        .sort((a, b) => b.lastTs - a.lastTs);

      conversations.forEach(c => {
        c.messages.sort((a, b) => a.timestamp - b.timestamp);
      });

      renderConvList();
      if (selectedSender) selectConv(selectedSender);
    }

    // ── CONV LIST ──
    function renderConvList(filter = '') {
      const list = document.getElementById('convList');
      const filtered = filter
        ? conversations.filter(c => c.sender.toLowerCase().includes(filter))
        : conversations;

      if (!filtered.length) {
        list.innerHTML = `<div class="conv-empty"><p>${filter ? 'No results' : 'No messages yet'}</p></div>`;
        return;
      }

      list.innerHTML = filtered.map(c => {
        const last = c.messages[c.messages.length - 1];
        const preview = last ? last.text.substring(0, 42) + (last.text.length > 42 ? '…' : '') : '';
        const time = last ? formatTime(last.timestamp) : '';
        const initials = c.sender.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
        return `
          <div class="conv-item ${selectedSender === c.sender ? 'active' : ''}" onclick="selectConv('${c.sender}')">
            <div class="conv-item-top">
              <div class="conv-name">
                ${c.hasUnread ? '<span class="conv-unread"></span>' : ''}${c.sender}
              </div>
              <div class="conv-time">${time}</div>
            </div>
            <div class="conv-preview">${preview}</div>
          </div>`;
      }).join('');
    }

    function filterConvs() {
      renderConvList(document.getElementById('convSearch').value.toLowerCase());
    }

    // ── SELECT CONV ──
    function selectConv(sender) {
      selectedSender = sender;
      const conv = conversations.find(c => c.sender === sender);
      if (!conv) return;

      // Mark read (optimistic)
      conv.hasUnread = false;

      document.getElementById('threadEmpty').style.display  = 'none';
      const active = document.getElementById('threadActive');
      active.style.display = 'flex';

      const initials = sender.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
      document.getElementById('threadAvatar').textContent = initials;
      document.getElementById('threadName').textContent   = sender;
      document.getElementById('threadCount').textContent  =
        conv.messages.length + ' message' + (conv.messages.length !== 1 ? 's' : '');

      // Render messages
      const container = document.getElementById('threadMessages');
      container.innerHTML = conv.messages.map(m => {
        const isAdmin = m.isAdmin;
        const time = new Date(m.timestamp).toLocaleTimeString('en-NG', { hour:'2-digit', minute:'2-digit' });
        const senderLabel = isAdmin ? 'Sweet Delights' : m.sender;
        return `
          <div class="msg-wrap ${isAdmin ? 'admin' : 'customer'}">
            <div class="msg-sender">${senderLabel}</div>
            <div class="msg-bubble ${isAdmin ? 'admin' : 'customer'}">${escapeHTML(m.text)}</div>
            <div class="msg-time">${time}</div>
          </div>`;
      }).join('');

      container.scrollTop = container.scrollHeight;
      renderConvList(document.getElementById('convSearch').value.toLowerCase());
    }

    // ── REPLY ──
    function sendReply() {
      if (!selectedSender) return;
      const input = document.getElementById('replyInput');
      const text  = input.value.trim();
      if (!text) return;

      // BACKEND PLACEHOLDER:
      // await fetch('/api/admin/messages/reply', {
      //   method: 'POST',
      //   headers: { 'Content-Type':'application/json', Authorization:'Bearer '+token },
      //   body: JSON.stringify({ replyTo: selectedSender, text })
      // });

      window.dataManager.sendMessage({
        sender:  'Sweet Delights Admin',
        text:    text,
        isAdmin: true,
        replyTo: selectedSender
      });

      input.value = '';
      input.style.height = '';
      load();
    }

    // ── HELPERS ──
    function formatTime(ts) {
      const d = new Date(ts);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString('en-NG', { hour:'2-digit', minute:'2-digit' });
      }
      return d.toLocaleDateString('en-NG', { day:'numeric', month:'short' });
    }

    function escapeHTML(str) {
      return str
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
    }

    function autoResize(el) {
      el.style.height = '';
      el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
    }

    function handleLogout() {
      if (window.dataManager.logout) window.dataManager.logout();
      window.location.href = '../auth/admin-login.html';
    }

    // ── INIT ──
    load();
    setInterval(load, 10000); // poll every 10s — replace with WS when backend is live
    window.dataManager.onMessagesChange(() => load());
  </script>
</body>
</html>
