<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Sweet Delights Bakery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --brown: #5C3317;
      --brown-mid: #7A4728;
      --gold: #C4924A;
      --cream: #FAF6F0;
      --ink: #1C1410;
      --stone: #9E8A78;
      --border: rgba(92,51,23,0.14);
      --error: #9B2C2C;
      --success: #276749;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      width: min(100%, 460px);
      background: #fff;
      border: 1px solid var(--border);
      padding: 2rem;
    }

    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      color: var(--brown);
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--stone);
      font-size: 0.92rem;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    .alert {
      display: none;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }

    .alert.show { display: block; }
    .alert-error {
      color: var(--error);
      background: rgba(155,44,44,0.08);
      border-color: rgba(155,44,44,0.2);
    }
    .alert-success {
      color: var(--success);
      background: rgba(39,103,73,0.08);
      border-color: rgba(39,103,73,0.2);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--stone);
      font-weight: 500;
    }

    input {
      padding: 0.9rem 1rem;
      border: 1px solid var(--border);
      font: inherit;
      background: var(--cream);
    }

    input:focus {
      outline: none;
      border-color: var(--gold);
      background: #fff;
    }

    .btn-primary {
      width: 100%;
      border: none;
      background: var(--brown);
      color: #fff;
      padding: 0.95rem 1rem;
      font: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .links {
      margin-top: 1.25rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .links a {
      color: var(--brown);
      text-decoration: none;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Account recovery</p>
    <h1>Reset your password</h1>
    <p class="subtitle">Enter the email address linked to your account and we’ll send you a reset link.</p>

    <div id="alertMessage" class="alert"></div>

    <form id="forgotPasswordForm">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email" />
      </div>

      <button type="submit" id="submitBtn" class="btn-primary">Send reset link</button>
    </form>

    <div class="links">
      <a href="login.html">Back to login</a>
      <a href="../index.html">Back to site</a>
    </div>
  </div>

  <script type="module">
    import { apiForgotPassword } from '../js/api.js'

    const form = document.getElementById('forgotPasswordForm')
    const btn = document.getElementById('submitBtn')
    const alert = document.getElementById('alertMessage')

    function showAlert(message, type) {
      alert.textContent = message
      alert.className = 'alert alert-' + type + ' show'
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()

      const email = document.getElementById('email').value.trim()
      if (!email) {
        showAlert('Please enter your email address.', 'error')
        return
      }

      btn.disabled = true
      btn.textContent = 'Sending...'

      try {
        const data = await apiForgotPassword(email)
        showAlert(data.message || 'If an account exists, a reset link has been sent.', 'success')
        form.reset()
      } catch (error) {
        showAlert(error.message || 'Unable to send reset link right now.', 'error')
      } finally {
        btn.disabled = false
        btn.textContent = 'Send reset link'
      }
    })
  </script>
</body>
</html>
