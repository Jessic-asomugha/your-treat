<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Forgot Password - Sweet Delights Bakery</title>

  <link rel="stylesheet" href="auth.css" />

</head>

<body>



  <div class="auth-container">

    <!-- Header -->

    <div class="auth-header">

      <div class="auth-logo">Sweet Delights</div>

      <h1 class="auth-title">Reset Password</h1>

      <p class="auth-subtitle">Enter your email to receive a password reset link</p>

    </div>



    <!-- Alert Messages -->

    <div id="alertMessage" class="alert"></div>



    <!-- Reset Form -->

    <form id="resetForm" class="auth-form" style="display: block;">

      

      <div class="form-group">

        <label class="form-label" for="email">Email Address</label>

        <input 

          type="email" 

          id="email" 

          class="form-input" 

          placeholder="your@email.com" 

          required 

          autocomplete="email"

        />

      </div>



      <button type="submit" id="resetBtn" class="btn btn-primary">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>

          <polyline points="22,6 12,13 2,6"/>

        </svg>

        Send Reset Link

      </button>



    </form>



    <!-- Success Message (hidden initially) -->

    <div id="successMessage" class="success-message" style="display: none;">

      <div class="success-icon">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          <polyline points="20 6 9 17 4 12"/>

        </svg>

      </div>

      <h2>Email Sent!</h2>

      <p>Check your inbox for a password reset link. The link will expire in 1 hour.</p>

      <a href="login.html" class="btn btn-primary" style="margin-top: 1rem;">

        Back to Login

      </a>

    </div>



    <!-- Links -->

    <div class="auth-links">

      <p class="auth-text">

        Remember your password? 

        <a href="login.html" class="auth-link">Login</a>

      </p>

    </div>



    <!-- Back to Site -->

    <div class="back-to-site">

      <a href="../index.html">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          <line x1="19" y1="12" x2="5" y2="12"/>

          <polyline points="12 19 5 12 12 5"/>

        </svg>

        Back to website

      </a>

    </div>

  </div>



<script src="../js/simple-data-manager.js"></script>



  <script>

    const resetForm = document.getElementById('resetForm');

    const resetBtn = document.getElementById('resetBtn');

    const alertMessage = document.getElementById('alertMessage');

    const successMessage = document.getElementById('successMessage');



    // Handle password reset

    resetForm.addEventListener('submit', async (e) => {

      e.preventDefault();



      const email = document.getElementById('email').value.trim();



      // Show loading state

      resetBtn.classList.add('btn-loading');

      resetBtn.disabled = true;

      hideAlert();



      try {

        await window.authManager.sendPasswordResetEmail(email);



        // Success - show success message

        resetForm.style.display = 'none';

        successMessage.style.display = 'block';



      } catch (error) {

        console.error('Password reset error:', error);

        showAlert(error.message, 'error');

        resetBtn.classList.remove('btn-loading');

        resetBtn.disabled = false;

      }

    });



    // Alert helper functions

    function showAlert(message, type) {

      alertMessage.textContent = message;

      alertMessage.className = `alert alert-${type} show`;

    }



    function hideAlert() {

      alertMessage.className = 'alert';

    }

  </script>



</body>

</html>
