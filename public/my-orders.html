<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders - Sweet Delights Bakery</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--cream);
      overflow-x: auto;
      padding-bottom: 1rem;
    }
    .tab {
      padding: 0.75rem 1.5rem;
      border-radius: 10px 10px 0 0;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      color: var(--text-medium);
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .tab:hover {
      background: var(--cream);
      color: var(--primary-color);
    }
    .tab.active {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
      color: white;
    }
    .order-card {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      animation: slideUp 0.4s ease;
    }
    .order-card:hover {
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      transform: translateY(-3px);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">Sweet Delights</div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="order.html">Order</a>
      <a href="my-orders.html" class="active">My Orders</a>
      <a href="chat.html">Chat</a>
    </nav>
  </header>

  <!-- My Orders Section -->
  <section class="featured">
    <h2>My Orders</h2>
    <p style="max-width: 600px; margin: 0 auto 2rem; color: var(--text-medium);">
      View and manage all your cake orders
    </p>

    <div style="max-width: 1200px; margin: 0 auto;">
      
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="filterOrders('all')">All Orders</button>
        <button class="tab" onclick="filterOrders('Pending')">Pending</button>
        <button class="tab" onclick="filterOrders('Confirmed')">Confirmed</button>
        <button class="tab" onclick="filterOrders('Baking')">Baking</button>
        <button class="tab" onclick="filterOrders('Delivered')">Delivered</button>
        <button class="tab" onclick="filterOrders('Cancelled')">Cancelled</button>
      </div>

      <!-- Orders Container -->
      <div id="ordersContainer">
        <div style="text-align: center; padding: 3rem; color: var(--text-medium);">
          <div style="width: 60px; height: 60px; border: 4px solid var(--cream); border-top-color: var(--primary-color); border-radius: 50%; margin: 0 auto 1.5rem; animation: spin 1s linear infinite;"></div>
          <p style="font-size: 1.1rem;">Loading your orders...</p>
        </div>
      </div>

    </div>
  </section>

  <!-- Footer -->
<footer class="footer">
  <p>© 2026 Sweet Delights Bakery</p>
  <p style="margin-top: 0.5rem; font-size: 0.875rem;">
    <a href="../auth/admin-login.html" style="color: var(--text-medium);">Admin Login</a>
  </p>
</footer>

  <script src="../js/main.js"></script>
<script src="../js/simple-data-manager.js"></script>

  <script>
    let allOrders = [];
    let currentFilter = 'all';

    // Load orders on page load
    document.addEventListener('DOMContentLoaded', async function() {
      await new Promise(resolve => setTimeout(resolve, 1000));
      loadOrders();
      
      // Set up real-time listener
      window.dataManager.onOrdersChange((orders) => {
        allOrders = orders;
        displayOrders(currentFilter);
      });
    });

    async function loadOrders() {
      try {
        allOrders = await window.dataManager.getOrders();
        displayOrders('all');
      } catch (error) {
        console.error('Error loading orders:', error);
        showError();
      }
    }

    function displayOrders(filter) {
      currentFilter = filter;
      const container = document.getElementById('ordersContainer');

      // Update active tab
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });
      event?.target?.classList.add('active');

      // Filter orders
      let filteredOrders = allOrders;
      if (filter !== 'all') {
        filteredOrders = allOrders.filter(order => order.status === filter);
      }

      // Check if empty
      if (filteredOrders.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 4rem 2rem; background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--text-medium)" stroke-width="1.5" style="margin: 0 auto 1.5rem; opacity: 0.3;">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
            </svg>
            <h3 style="color: var(--primary-color); margin-bottom: 1rem;">No ${filter === 'all' ? '' : filter} Orders</h3>
            <p style="color: var(--text-medium); margin-bottom: 2rem;">
              ${filter === 'all' ? "You haven't placed any orders yet." : `No ${filter.toLowerCase()} orders found.`}
            </p>
            ${filter === 'all' ? '<a href="order.html" class="btn primary">Place Your First Order</a>' : ''}
          </div>
        `;
        return;
      }

      // Display orders
      container.innerHTML = filteredOrders.map(order => createOrderCard(order)).join('');
    }

    function createOrderCard(order) {
      const statusColors = {
        'Pending': { bg: '#FFF3CD', color: '#856404', border: '#FFA500' },
        'Confirmed': { bg: '#D1ECF1', color: '#0C5460', border: '#17A2B8' },
        'Baking': { bg: '#F8D7DA', color: '#721C24', border: '#DC3545' },
        'Delivered': { bg: '#D4EDDA', color: '#155724', border: '#28A745' },
        'Cancelled': { bg: '#F5C6CB', color: '#721C24', border: '#DC3545' }
      };

      const statusColor = statusColors[order.status] || statusColors.Pending;

      return `
        <div class="order-card">
          <!-- Header -->
          <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; padding-bottom: 1.5rem; border-bottom: 2px solid var(--cream);">
            <div>
              <h3 style="font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--primary-color); margin-bottom: 0.5rem;">
                Order #${order.id}
              </h3>
              <p style="color: var(--text-medium); font-size: 0.95rem;">
                Placed on ${new Date(order.createdAt).toLocaleDateString('en-US', { 
                  weekday: 'long', 
                  year: 'numeric', 
                  month: 'long', 
                  day: 'numeric',
                  hour: '2-digit',
                  minute: '2-digit'
                })}
              </p>
            </div>
            <div style="background: ${statusColor.bg}; color: ${statusColor.color}; padding: 0.75rem 1.5rem; border-radius: 25px; border: 2px solid ${statusColor.border}; font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 0.5rem;">
              <span style="width: 10px; height: 10px; background: ${statusColor.border}; border-radius: 50%;"></span>
              ${order.status}
            </div>
          </div>

          <!-- Order Details Grid -->
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
            <div style="background: var(--cream); padding: 1.25rem; border-radius: 12px;">
              <p style="font-size: 0.8rem; color: var(--text-medium); margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase;">Cake</p>
              <p style="font-size: 1.1rem; font-weight: 600; color: var(--primary-color);">${order.cakeName || 'N/A'}</p>
              <p style="font-size: 0.9rem; color: var(--text-dark); margin-top: 0.25rem;">${order.size || 'N/A'} • ${order.layers || 'N/A'} layers</p>
            </div>

            <div style="background: var(--cream); padding: 1.25rem; border-radius: 12px;">
              <p style="font-size: 0.8rem; color: var(--text-medium); margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase;">Delivery</p>
              <p style="font-size: 1.1rem; font-weight: 600; color: var(--primary-color);">${order.deliveryOption === 'pickup' ? 'Pickup' : 'Delivery'}</p>
              <p style="font-size: 0.9rem; color: var(--text-dark); margin-top: 0.25rem;">
                ${order.deliveryDate ? new Date(order.deliveryDate).toLocaleDateString('en-US', { 
                  month: 'short', 
                  day: 'numeric', 
                  year: 'numeric' 
                }) : 'N/A'}
              </p>
            </div>

            <div style="background: var(--cream); padding: 1.25rem; border-radius: 12px;">
              <p style="font-size: 0.8rem; color: var(--text-medium); margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase;">Quantity</p>
              <p style="font-size: 1.1rem; font-weight: 600; color: var(--primary-color);">${order.quantity || 1} cake(s)</p>
              <p style="font-size: 0.9rem; color: var(--text-dark); margin-top: 0.25rem;">Flavor: ${order.flavor || 'Standard'}</p>
            </div>
          </div>

          <!-- Payment Details -->
          ${order.status !== 'Cancelled' && order.status !== 'Delivered' ? `
            <div style="background: linear-gradient(135deg, #FFF9E6 0%, #FFE8A3 100%); padding: 1.5rem; border-radius: 15px; margin-bottom: 1.5rem; border: 2px solid var(--accent-gold);">
              <h4 style="color: var(--primary-color); margin-bottom: 1rem; font-weight: 700; font-size: 1.1rem;">💳 Payment Information</h4>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1rem;">
                <div>
                  <p style="font-size: 0.75rem; color: var(--text-medium); margin-bottom: 0.25rem; font-weight: 600;">Bank Name</p>
                  <p style="font-weight: 600; color: var(--text-dark);">First Bank</p>
                </div>
                <div>
                  <p style="font-size: 0.75rem; color: var(--text-medium); margin-bottom: 0.25rem; font-weight: 600;">Account Name</p>
                  <p style="font-weight: 600; color: var(--text-dark);">Sweet Creations Ltd</p>
                </div>
                <div>
                  <p style="font-size: 0.75rem; color: var(--text-medium); margin-bottom: 0.25rem; font-weight: 600;">Account Number</p>
                  <p style="font-weight: 700; color: var(--text-dark); font-family: monospace;">1234567890</p>
                </div>
                <div>
                  <p style="font-size: 0.75rem; color: var(--text-medium); margin-bottom: 0.25rem; font-weight: 600;">Reference</p>
                  <p style="font-weight: 700; color: var(--primary-color); font-family: monospace;">${order.id}</p>
                </div>
              </div>
              <p style="font-size: 0.85rem; color: #856404; background: #FFF3CD; padding: 0.75rem; border-radius: 8px;">
                <strong>⚠️ Important:</strong> Use Order ID <strong>${order.id}</strong> as payment reference. WhatsApp proof to <strong>+234 800 123 4567</strong>
              </p>
            </div>
          ` : ''}

          <!-- Special Requests -->
          ${order.specialRequests ? `
            <div style="background: var(--cream); padding: 1.25rem; border-radius: 12px; margin-bottom: 1.5rem; border-left: 4px solid var(--accent-gold);">
              <p style="font-size: 0.8rem; color: var(--text-medium); margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase;">Special Requests</p>
              <p style="color: var(--text-dark); line-height: 1.6;">${order.specialRequests}</p>
            </div>
          ` : ''}

          <!-- Actions -->
          <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: flex-end;">
            ${order.status !== 'Cancelled' && order.status !== 'Delivered' ? `
              <button onclick="cancelOrder('${order.id}')" class="btn" style="background: transparent; color: var(--error); border: 2px solid var(--error); padding: 0.75rem 1.5rem;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="15" y1="9" x2="9" y2="15"/>
                  <line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
                Cancel Order
              </button>
            ` : ''}
            <a href="chat.html" class="btn" style="background: var(--cream); color: var(--primary-color); border: 2px solid var(--accent-gold); padding: 0.75rem 1.5rem; text-decoration: none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              Contact Us
            </a>
          </div>
        </div>
      `;
    }

    function filterOrders(status) {
      // Update active tab
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');
      
      displayOrders(status);
    }

    async function cancelOrder(orderId) {
      if (!confirm('Are you sure you want to cancel this order? This action cannot be undone.')) {
        return;
      }

      try {
        await window.dataManager.cancelOrder(orderId);
        alert('Order cancelled successfully');
        loadOrders();
      } catch (error) {
        console.error('Error cancelling order:', error);
        alert('Error cancelling order. Please contact us for assistance.');
      }
    }

    function showError() {
      const container = document.getElementById('ordersContainer');
      container.innerHTML = `
        <div style="text-align: center; padding: 3rem; background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
          <p style="color: var(--error); font-size: 1.1rem;">Error loading orders. Please refresh the page.</p>
          <button onclick="location.reload()" class="btn primary" style="margin-top: 1.5rem;">Refresh Page</button>
        </div>
      `;
    }
  </script>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

</body>
</html>

  <script>
    // My Orders page specific code
    document.addEventListener('DOMContentLoaded', async function() {
      await new Promise(resolve => setTimeout(resolve, 500));

      const orderLookupForm = document.getElementById('orderLookupForm');
      const orderIdInput = document.getElementById('orderIdInput');
      const ordersContainer = document.getElementById('ordersContainer');

      // Check if user is authenticated and load their orders
      window.onAuthStateChanged = async (user) => {
        if (user) {
          // User is logged in - show their orders
          await loadUserOrders(user);
        } else {
          // User not logged in - show order ID lookup
          showOrderLookup();
        }
      };

      // Load all orders for logged-in user
      async function loadUserOrders(user) {
        try {
          const orders = await window.authManager.getUserOrders();
          
          if (orders.length === 0) {
            ordersContainer.innerHTML = `
              <div style="text-align: center; padding: 3rem; background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--text-medium)" stroke-width="1.5" style="margin: 0 auto 1.5rem; opacity: 0.3;">
                  <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                  <line x1="3" y1="6" x2="21" y2="6"/>
                </svg>
                <h3 style="color: var(--primary-color); margin-bottom: 1rem;">No Orders Yet</h3>
                <p style="color: var(--text-medium); margin-bottom: 2rem;">You haven't placed any orders yet.</p>
                <a href="order.html" class="btn primary">Place Your First Order</a>
              </div>
            `;
            return;
          }

          // Display all user's orders
          ordersContainer.innerHTML = `
            <div style="margin-bottom: 2rem;">
              <h3 style="color: var(--primary-color); font-size: 1.5rem;">Your Orders (${orders.length})</h3>
            </div>
            <div style="display: grid; gap: 2rem;">
              ${orders.map(order => createOrderCard(order)).join('')}
            </div>
          `;

          // Set up real-time listeners for each order
          orders.forEach(order => {
            window.dataManager.db.ref('orders/' + order.id).on('value', (snapshot) => {
              const updatedOrder = snapshot.val();
              if (updatedOrder) {
                // Refresh the specific order card
                loadUserOrders(user);
              }
            });
          });

        } catch (error) {
          console.error('Error loading orders:', error);
          ordersContainer.innerHTML = `
            <div style="text-align: center; padding: 3rem; background: white; border-radius: 20px;">
              <p style="color: var(--error);">Error loading orders. Please refresh the page.</p>
            </div>
          `;
        }
      }

      function createOrderCard(order) {
        const statusColors = {
          'Pending': '#FFA500',
          'Confirmed': '#4CAF50',
          'Baking': '#FF6B6B',
          'Delivered': '#4CAF50',
          'Cancelled': '#FF4444'
        };

        return `
          <div style="background: white; border-radius: 20px; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); cursor: pointer; transition: all 0.3s ease;" onclick="viewFullOrder('${order.id}')">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
              <div>
                <h4 style="font-size: 1.3rem; color: var(--primary-color); margin-bottom: 0.5rem;">Order #${order.id}</h4>
                <p style="color: var(--text-medium); font-size: 0.9rem;">${new Date(order.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
              </div>
              <div style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.5rem; background: ${statusColors[order.status]}15; border: 2px solid ${statusColors[order.status]}; border-radius: 20px;">
                <span style="width: 8px; height: 8px; background: ${statusColors[order.status]}; border-radius: 50%;"></span>
                <span style="font-weight: 600; color: ${statusColors[order.status]};">${order.status}</span>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; padding: 1.5rem; background: var(--cream); border-radius: 12px;">
              <div>
                <p style="font-size: 0.8rem; color: var(--text-medium); margin-bottom: 0.25rem;">Cake</p>
                <p style="font-weight: 600; color: var(--text-dark);">${order.cakeName || 'N/A'}</p>
              </div>
              <div>
                <p style="font-size: 0.8rem; color: var(--text-medium); margin-bottom: 0.25rem;">Size</p>
                <p style="font-weight: 600; color: var(--text-dark);">${order.size || 'N/A'}</p>
              </div>
              <div>
                <p style="font-size: 0.8rem; color: var(--text-medium); margin-bottom: 0.25rem;">Delivery</p>
                <p style="font-weight: 600; color: var(--text-dark);">${new Date(order.deliveryDate).toLocaleDateString()}</p>
              </div>
            </div>

            <div style="margin-top: 1rem; text-align: right;">
              <span style="color: var(--primary-color); font-weight: 500; font-size: 0.9rem;">Click to view details →</span>
            </div>
          </div>
        `;
      }

      function showOrderLookup() {
        // Show the order lookup form (default state)
      }

      window.viewFullOrder = async (orderId) => {
        const order = await window.dataManager.getOrderById(orderId);
        if (order) {
          displayOrder(order);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      orderLookupForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const orderId = orderIdInput.value.trim().toUpperCase();
        if (!orderId) return;

        try {
          const order = await window.dataManager.getOrderById(orderId);
          
          if (order) {
            displayOrder(order);
            
            // Set up real-time listener
            window.dataManager.db.ref('orders/' + orderId).on('value', (snapshot) => {
              const updatedOrder = snapshot.val();
              if (updatedOrder) displayOrder(updatedOrder);
            });
          } else {
            showNotFound();
          }
        } catch (error) {
          console.error('Error finding order:', error);
          alert('Error finding order. Please try again.');
        }
      });

      function displayOrder(order) {
        const statusColors = {
          'Pending': '#FFA500',
          'Confirmed': '#4CAF50',
          'Baking': '#FF6B6B',
          'Delivered': '#4CAF50',
          'Cancelled': '#FF4444'
        };

        const statusIcons = {
          'Pending': '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
          'Confirmed': '<polyline points="20 6 9 17 4 12"/>',
          'Baking': '<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
          'Delivered': '<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
          'Cancelled': '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>'
        };

        ordersContainer.innerHTML = `
          <div style="background: white; border-radius: 30px; padding: 3rem; box-shadow: 0 10px 40px rgba(0,0,0,0.1); animation: slideUp 0.4s ease;">
            
            <div style="border-bottom: 2px solid var(--cream); padding-bottom: 2rem; margin-bottom: 2rem;">
              <div style="display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 1rem;">
                <div>
                  <h3 style="font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--primary-color); margin-bottom: 0.5rem;">
                    Order #${order.id}
                  </h3>
                  <p style="color: var(--text-medium); font-size: 1rem;">
                    Placed on ${new Date(order.createdAt).toLocaleString()}
                  </p>
                </div>
                <div style="display: inline-flex; align-items: center; gap: 0.75rem; padding: 1rem 2rem; background: ${statusColors[order.status]}15; border: 2px solid ${statusColors[order.status]}; border-radius: 25px;">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${statusColors[order.status]}" stroke-width="2">
                    ${statusIcons[order.status]}
                  </svg>
                  <span style="font-weight: 700; color: ${statusColors[order.status]}; font-size: 1.1rem;">
                    ${order.status}
                  </span>
                </div>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; margin-bottom: 2rem;">
              
              <div style="background: var(--cream); padding: 1.5rem; border-radius: 15px;">
                <h4 style="font-size: 0.85rem; color: var(--text-medium); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem; font-weight: 600;">Cake Details</h4>
                <p style="font-size: 1.2rem; color: var(--primary-color); font-weight: 600; margin-bottom: 0.5rem;">${order.cakeName || 'N/A'}</p>
                <p style="color: var(--text-dark); font-size: 0.95rem;">${order.size || 'N/A'} • ${order.layers || 'N/A'} layers</p>
                <p style="color: var(--text-medium); font-size: 0.9rem; margin-top: 0.5rem;">Flavor: ${order.flavor || 'N/A'}</p>
              </div>

              <div style="background: var(--cream); padding: 1.5rem; border-radius: 15px;">
                <h4 style="font-size: 0.85rem; color: var(--text-medium); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem; font-weight: 600;">Delivery Info</h4>
                <p style="font-size: 1.2rem; color: var(--primary-color); font-weight: 600; margin-bottom: 0.5rem;">${order.deliveryOption === 'pickup' ? 'Pickup' : 'Delivery'}</p>
                <p style="color: var(--text-dark); font-size: 0.95rem;">${new Date(order.deliveryDate).toLocaleDateString()}</p>
              </div>

              <div style="background: var(--cream); padding: 1.5rem; border-radius: 15px;">
                <h4 style="font-size: 0.85rem; color: var(--text-medium); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem; font-weight: 600;">Contact Info</h4>
                <p style="font-size: 1.2rem; color: var(--primary-color); font-weight: 600; margin-bottom: 0.5rem;">${order.customerName}</p>
                <p style="color: var(--text-dark); font-size: 0.95rem;">${order.customerPhone}</p>
              </div>

            </div>

            ${order.specialRequests ? `
              <div style="background: var(--cream); padding: 1.5rem; border-radius: 15px; margin-bottom: 2rem; border-left: 4px solid var(--accent-gold);">
                <h4 style="font-size: 0.85rem; color: var(--text-medium); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem; font-weight: 600;">Special Requests</h4>
                <p style="color: var(--text-dark); font-size: 0.95rem; line-height: 1.6;">${order.specialRequests}</p>
              </div>
            ` : ''}

            <div style="background: linear-gradient(135deg, var(--cream) 0%, var(--cream-dark) 100%); padding: 2rem; border-radius: 20px; margin-bottom: 2rem; border: 2px solid var(--accent-gold);">
              <h3 style="font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--primary-color); margin-bottom: 1.5rem; text-align: center;">Payment Information</h3>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
                <div style="background: white; padding: 1rem; border-radius: 10px;">
                  <p style="font-size: 0.8rem; color: var(--text-medium); margin-bottom: 0.5rem; font-weight: 600;">Bank Name</p>
                  <p style="color: var(--text-dark); font-weight: 500;">First Bank of Nigeria</p>
                </div>
                <div style="background: white; padding: 1rem; border-radius: 10px;">
                  <p style="font-size: 0.8rem; color: var(--text-medium); margin-bottom: 0.5rem; font-weight: 600;">Account Name</p>
                  <p style="color: var(--text-dark); font-weight: 500;">Sweet Creations Bakery Ltd</p>
                </div>
                <div style="background: white; padding: 1rem; border-radius: 10px;">
                  <p style="font-size: 0.8rem; color: var(--text-medium); margin-bottom: 0.5rem; font-weight: 600;">Account Number</p>
                  <p style="color: var(--text-dark); font-weight: 600; font-family: monospace; font-size: 1.1rem;">1234567890</p>
                </div>
                <div style="background: white; padding: 1rem; border-radius: 10px;">
                  <p style="font-size: 0.8rem; color: var(--text-medium); margin-bottom: 0.5rem; font-weight: 600;">Payment Reference</p>
                  <p style="color: var(--primary-color); font-weight: 700; font-family: monospace;">${order.id}</p>
                </div>
              </div>
              <div style="background: #fff3cd; padding: 1rem; border-radius: 10px; border-left: 4px solid var(--warning-orange);">
                <p style="color: #856404; font-size: 0.9rem; margin: 0;"><strong>Important:</strong> Use Order ID <strong>${order.id}</strong> as payment reference. Send proof to WhatsApp: <strong>+234 800 123 4567</strong></p>
              </div>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
              ${order.status !== 'Cancelled' && order.status !== 'Delivered' ? `
                <button onclick="cancelOrder('${order.id}')" class="btn" style="background: transparent; color: var(--error-red); border: 2px solid var(--error-red);">Cancel Order</button>
              ` : ''}
              <a href="chat.html" class="btn primary">Contact Us</a>
            </div>

          </div>
        `;
      }

      function showNotFound() {
        ordersContainer.innerHTML = `
          <div style="text-align: center; padding: 3rem; background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
            <h3 style="color: var(--primary-color); margin-bottom: 1rem;">Order Not Found</h3>
            <p style="color: var(--text-medium); margin-bottom: 2rem;">We couldn't find an order with that ID. Please check and try again.</p>
            <button onclick="document.getElementById('orderIdInput').value = ''; document.getElementById('orderIdInput').focus();" class="btn primary">Try Again</button>
          </div>
        `;
      }

      window.cancelOrder = async function(orderId) {
        if (!confirm('Are you sure you want to cancel this order?')) return;
        try {
          await window.dataManager.cancelOrder(orderId);
          alert('Order cancelled successfully');
          const order = await window.dataManager.getOrderById(orderId);
          if (order) displayOrder(order);
        } catch (error) {
          console.error('Error cancelling order:', error);
          alert('Error cancelling order. Please try again.');
        }
      };
    });
  </script>

  <style>
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

</body>
</html>
