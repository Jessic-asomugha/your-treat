<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Chat - Sweet Delights Bakery</title>
  <link rel="stylesheet" href="CSS/styles.css" />
  <style>
    /* Name prompt modal */
    .name-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }

    .name-modal.show {
      display: flex;
    }

    .name-modal-content {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .name-modal-content h2 {
      margin: 0 0 1rem 0;
      color: var(--primary-color);
      font-size: 1.5rem;
    }

    .name-modal-content p {
      margin: 0 0 1.5rem 0;
      color: var(--text-medium);
    }

    .name-modal-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1.5rem;
      font-family: inherit;
    }

    .name-modal-input:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .name-modal-button {
      width: 100%;
      padding: 0.875rem;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .name-modal-button:hover {
      background: #7a3e1a;
    }

    .name-modal-button:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }

    .chat-user-badge {
      background: var(--cream);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-user-badge button {
      background: transparent;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      padding: 0.375rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .chat-user-badge button:hover {
      background: var(--primary-color);
      color: white;
    }
  </style>
</head>
<body>

  <!-- Name Prompt Modal -->
  <div class="name-modal" id="nameModal">
    <div class="name-modal-content">
      <h2>👋 Welcome to Our Chat!</h2>
      <p>What should we call you?</p>
      <form id="nameForm">
        <input 
          type="text" 
          id="guestNameInput" 
          class="name-modal-input" 
          placeholder="Enter your name..." 
          required
          maxlength="30"
          autocomplete="name"
        />
        <button type="submit" class="name-modal-button">Start Chatting</button>
      </form>
    </div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="logo">Sweet Delights</div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="order.html">Order</a>
      <a href="my-orders.html">My Orders</a>
      <a href="chat.html">Chat</a>
    </nav>
  </header>

  <!-- Chat Section -->
  <section class="featured">
    <h2>Chat with Us</h2>

    <!-- User badge showing current name -->
    <div class="chat-user-badge" id="userBadge" style="display: none;">
      <span>Chatting as: <strong id="displayUserName"></strong></span>
      <button type="button" onclick="changeGuestName()">Change Name</button>
    </div>

    <div class="chat-container">
      <div id="chatBox" class="chat-box">
        <!-- Messages will appear here -->
      </div>

      <form id="chatForm" class="chat-form">
        <input type="text" id="chatInput" placeholder="Type your message..." required />
        <button type="submit" class="btn primary">Send</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
<footer class="footer">
  <p> 2026 Sweet Delights Bakery</p>
  <p style="margin-top: 0.5rem; font-size: 0.875rem;">
    <a href="auth/admin-login.html" style="color: var(--text-medium);">Admin Login</a>
  </p>
</footer>

  <script src="js/admin.js"></script>
  <script src="js/simple-data-manager.js"></script>
  <script>
    // ==========================================
    // GUEST USER NAME MANAGEMENT
    // ==========================================

    let currentGuestName = null;

    // Check if user already has a name stored
    function getGuestName() {
      const stored = localStorage.getItem('guest_chat_name');
      return stored || null;
    }

    function setGuestName(name) {
      localStorage.setItem('guest_chat_name', name);
      currentGuestName = name;
      updateUserBadge();
    }

    function updateUserBadge() {
      const badge = document.getElementById('userBadge');
      const displayName = document.getElementById('displayUserName');
      
      if (currentGuestName) {
        displayName.textContent = currentGuestName;
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }

    function promptForName() {
      document.getElementById('nameModal').classList.add('show');
      setTimeout(() => {
        document.getElementById('guestNameInput').focus();
      }, 100);
    }

    function closeNameModal() {
      document.getElementById('nameModal').classList.remove('show');
    }

    window.changeGuestName = function() {
      promptForName();
      document.getElementById('guestNameInput').value = currentGuestName || '';
    };

    // Handle name form submission
    document.getElementById('nameForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('guestNameInput').value.trim();
      
      if (name) {
        setGuestName(name);
        closeNameModal();
        // Load messages after name is set
        loadChatMessages();
      }
    });

    // ==========================================
    // CHAT FUNCTIONALITY
    // ==========================================

    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    let messagesLoaded = false;

    // Initialize chat on page load
    document.addEventListener('DOMContentLoaded', function() {
      // Check if user has a name
      const existingName = getGuestName();
      
      if (existingName) {
        currentGuestName = existingName;
        updateUserBadge();
        loadChatMessages();
      } else {
        // Show name prompt for first-time users
        promptForName();
      }

      // Listen for new messages in real-time
      window.dataManager.onMessagesChange(() => {
        loadChatMessages();
      });
    });

    // Handle form submission
    chatForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const messageText = chatInput.value.trim();
      if (!messageText || !currentGuestName) return;

      try {
        // Send message
        window.dataManager.sendMessage({
          sender: currentGuestName,
          text: messageText,
          isAdmin: false
        });

        // Clear input
        chatInput.value = '';
        chatInput.focus();

      } catch (error) {
        console.error('Error sending message:', error);
        alert('Failed to send message. Please try again.');
      }
    });

    function loadChatMessages() {
      try {
        const messages = window.dataManager.getMessages();
        displayChatMessages(messages);
      } catch (error) {
        console.error('Error loading messages:', error);
      }
    }

    function displayChatMessages(messages) {
      if (messages.length === 0 && !messagesLoaded) {
        chatBox.innerHTML = `
          <div style="text-align: center; padding: 2rem; color: var(--text-medium);">
            👋 Welcome! Start the conversation by sending a message below.
          </div>
        `;
        return;
      }

      messagesLoaded = true;

      chatBox.innerHTML = messages.map(msg => `
        <div class="chat-message ${msg.isAdmin ? 'business-message' : 'user-message'}">
          <div style="font-size: 0.75rem; margin-bottom: 0.25rem; opacity: 0.8;">
            ${msg.sender} • ${new Date(msg.timestamp).toLocaleTimeString()}
          </div>
          ${msg.text}
        </div>
      `).join('');

      // Scroll to bottom
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
